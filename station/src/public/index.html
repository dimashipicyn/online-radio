<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Радио Слом</title>
<style>
  :root { --bg:#0d0f12; --card:#161a20; --line:#242a33; --txt:#e6e9ee; --dim:#8a94a3; --acc:#ff5c39; color-scheme:dark; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:15px/1.5 system-ui,-apple-system,sans-serif; }
  .wrap { max-width:880px; margin:0 auto; padding:20px 16px 60px; }
  body:not(.authed) .admin-only { display:none; }
  header { display:flex; align-items:center; gap:12px; margin:8px 0 18px; flex-wrap:wrap; }
  header > * { min-width:0; }
  header .spacer { margin-left:auto; }
  #adminBtn { margin-left:0; padding:7px 14px; font-size:13px; color:var(--txt); }
  body.authed #adminBtn { display:none; }
  h1, #stats { overflow-wrap:anywhere; }
  #stats:empty { display:none; }
  h1 { font-size:26px; letter-spacing:.5px; }
  .live { background:var(--acc); color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:1px; flex-shrink:0; }
  .live.off { background:#3a4149; }
  audio#stream { display:none; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:720px){ .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { font-size:14px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-bottom:12px; }
  .card h2 .muted { text-transform:none; letter-spacing:0; font-weight:400; }
  .np-title { font-size:19px; font-weight:600; min-height:26px; overflow-wrap:anywhere; }
  .np-artist { color:var(--dim); min-height:20px; overflow-wrap:anywhere; }
  .np-dj { margin-top:8px; color:var(--acc); font-size:13px; min-height:18px; white-space:pre-line; overflow-wrap:anywhere; }
  ul.hist { list-style:none; font-size:13px; color:var(--dim); }
  ul.hist:empty::before { content:"пока пусто"; color:var(--dim); font-size:13px; }
  ul.hist li { padding:3px 0; border-bottom:1px dashed var(--line); overflow-wrap:anywhere; }
  ul.hist li:last-child { border:none; }
  textarea, input:not([type=range]) { width:100%; background:#0f1216; border:1px solid var(--line); border-radius:8px; color:var(--txt); padding:9px 11px; font:inherit; margin-bottom:8px; }
  textarea { resize:vertical; min-height:64px; }
  input::placeholder, textarea::placeholder { color:#7d8794; opacity:1; }
  input[type=range] { width:100%; max-width:140px; height:24px; margin:0; padding:0; border:none; background:transparent; accent-color:var(--acc); cursor:pointer; }
  button { background:var(--acc); border:none; color:#fff; padding:9px 16px; border-radius:8px; font-weight:600; cursor:pointer; font:inherit; }
  button:hover { filter:brightness(1.1); }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); padding:3px 10px; font-size:12px; }
  #settingsReset, #loginClose { padding:9px 16px; font-size:inherit; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row > input, .row > textarea { flex:1; width:auto; min-width:0; margin-bottom:0; }
  .row > .msg { flex:1 1 140px; min-width:0; margin-top:0; }
  button:disabled { opacity:.55; cursor:default; filter:none; }
  .items { max-height:220px; overflow:auto; font-size:14px; }
  .items .it { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .items .it > span { flex:1; min-width:0; overflow-wrap:anywhere; }
  .items .it > button { flex-shrink:0; min-width:32px; min-height:32px; padding:4px 8px; }
  .items .it:last-child { border:none; }
  .msg { font-size:12px; color:var(--dim); min-height:16px; margin-top:4px; }
  .switch { display:flex; align-items:center; gap:10px; }
  button.toggle { width:44px; height:24px; padding:0; border:none; border-radius:12px; background:#3a4149; position:relative; cursor:pointer; transition:.2s; flex-shrink:0; }
  button.toggle.on { background:var(--acc); }
  button.toggle::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.2s; }
  button.toggle.on::after { left:23px; }
  button.toggle:focus-visible, button:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  .player { display:flex; align-items:center; gap:12px; margin:8px 0 22px; flex-wrap:wrap; }
  .play-btn { width:46px; height:46px; min-width:46px; border-radius:50%; font-size:15px; line-height:1; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:0; }
  #spectrum { flex:1 1 140px; height:46px; min-width:120px; background:#0f1216; border:1px solid var(--line); border-radius:8px; }
  .vol { display:flex; align-items:center; gap:6px; flex:1 1 140px; }
  #login { position:fixed; inset:0; background:rgba(8,9,12,.72); display:flex; align-items:center; justify-content:center; z-index:10; padding:16px; overflow:auto; overscroll-behavior:none; }
  #login .box { width:min(360px,100%); margin:auto; }
  #loginClose { width:100%; margin-top:8px; }
  #login h1 { margin-bottom:18px; }
  .err { color:#ff6b6b; font-size:13px; min-height:18px; margin-bottom:8px; }
  .muted { color:var(--dim); font-size:12px; }
  h3.set-h { font-size:12px; text-transform:uppercase; color:var(--acc); letter-spacing:1px; margin:14px 0 8px; }
  .set-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }
  @media (max-width:720px){ .set-grid { grid-template-columns:1fr; } }
  .set-f label { display:block; font-size:12px; margin-bottom:4px; }
  .set-f select { width:100%; background:#0f1216; border:1px solid var(--line); border-radius:8px; color:var(--txt); padding:9px 11px; font:inherit; }
  .set-f input, .set-f textarea, .set-f select { margin-bottom:0; }
  .set-grid .set-f:has(textarea) { grid-column:1 / -1; }
  .set-f.bool { display:flex; align-items:center; justify-content:space-between; gap:10px; background:#0f1216; border:1px solid var(--line); border-radius:8px; padding:9px 11px; }
</style>
</head>
<body>
<div id="login" style="display:none">
  <div class="box card">
    <h1>📻 <span id="loginName">Радио</span></h1>
    <div class="err" id="loginErr"></div>
    <input type="password" id="pwd" placeholder="пароль эфира">
    <button id="loginBtn" style="width:100%">Войти</button>
    <button type="button" class="ghost" id="loginClose">Закрыть</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <h1 id="radioName">Радио</h1>
    <span class="live" id="liveBadge">LIVE</span>
    <span class="muted" id="stats"></span>
    <div class="switch admin-only">
      <span class="muted">микрофон <span id="djName"></span></span>
      <button type="button" class="toggle on" id="djToggle" title="вкл/выкл вставки ведущего"></button>
    </div>
    <span class="spacer"></span>
    <button id="adminBtn" class="ghost">Войти</button>
  </header>
  <div class="player">
    <button class="play-btn" id="playBtn" title="плей/пауза">▶</button>
    <canvas id="spectrum"></canvas>
    <div class="vol">
      <span class="muted" title="громкость">🔊</span>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
    </div>
  </div>
  <audio id="stream" preload="none" src="/radio.mp3"></audio>

  <div class="grid">
    <div class="card">
      <h2>В эфире</h2>
      <div class="np-title" id="npTitle">—</div>
      <div class="np-artist" id="npArtist"></div>
      <div class="np-dj admin-only" id="npDj"></div>
    </div>
    <div class="card" id="callCard">
      <h2>Звонок в студию</h2>
      <input id="callName" placeholder="как вас зовут?">
      <textarea id="callText" placeholder="что скажете ди-джею?"></textarea>
      <div class="row"><button id="callBtn">Позвонить</button><span class="msg" id="callMsg"></span></div>
    </div>
  </div>

  <div class="admin-only">
  <div class="grid" style="margin-top:16px">
    <div class="card">
      <h2>Эфирная сетка</h2>
      <input id="topicText" placeholder="тема для ведущего…">
      <div class="row"><button id="topicBtn">В студию</button><span class="msg" id="topicMsg"></span></div>
      <div class="items" id="topicList" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h2>База знаний (RAG)</h2>
      <input id="kbTitle" placeholder="заголовок">
      <textarea id="kbText" placeholder="факты, байты, внутренние шутки студии…" style="min-height:52px"></textarea>
      <div class="row"><button id="kbBtn">Запомнить</button><span class="msg" id="kbMsg"></span></div>
      <div class="items" id="kbList" style="margin-top:10px"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>Настройки эфира <span class="muted">— применяются сразу, без рестарта</span></h2>
    <div id="settingsBody"><div class="muted">загрузка…</div></div>
    <div class="row" style="margin-top:12px">
      <button id="settingsSave">Сохранить</button>
      <button id="settingsReset" class="ghost" style="color:var(--txt)">Сбросить к дефолтам</button>
      <span class="msg" id="settingsMsg"></span>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>История эфира</h2>
    <ul class="hist" id="hist"></ul>
  </div>
  </div>
</div>

<script>
let authed = false;
const $ = (id) => document.getElementById(id);
const api = async (path, opts = {}) => {
  const r = await fetch(path, { headers: {'Content-Type':'application/json'}, ...opts });
  if (r.status === 401) { showLogin(true); throw new Error('unauth'); }
  return r.json();
};
const esc = (s) => (s || '').replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function setAuthed(on) {
  authed = on;
  document.body.classList.toggle('authed', on);
  $('app').style.display = 'block';
  $('adminBtn').textContent = 'Войти';
}
function showLogin(show) {
  $('login').style.display = show ? 'flex' : 'none';
  $('app').style.display = 'block';
  document.body.style.overflow = show ? 'hidden' : '';
  if (show) setTimeout(() => $('pwd').focus(), 50);
  else $('adminBtn').focus();
}

async function login() {
  const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: $('pwd').value }) });
  if (r.ok) { showLogin(false); setAuthed(true); boot(); }
  else $('loginErr').textContent = (await r.json()).error || 'ошибка';
}
$('loginBtn').onclick = login;
$('adminBtn').onclick = () => showLogin(true);
$('login').onclick = (e) => { if (e.target === $('login')) showLogin(false); };
$('loginClose').onclick = () => showLogin(false);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') showLogin(false); });
$('pwd').addEventListener('keydown', (e) => e.key === 'Enter' && login());

async function boot() {
  const st = await api('/api/state');
  $('radioName').textContent = st.radioName;
  $('loginName').textContent = st.radioName;
  $('djName').textContent = st.djName;
  $('djToggle').classList.toggle('on', st.program.djEnabled);
  loadSettings();
  refresh();  setInterval(refresh, 5000);
}

async function refresh() {
  try {
    const st = await api('/api/state');
    const np = st.nowPlaying;
    $('npTitle').textContent = np ? (np.title || '—') : 'тишина';
    $('npArtist').textContent = np && np.artist ? np.artist : '';
    $('npDj').textContent = np && np.isInsert && np.insertText ? `🎙 ${np.insertText}` : '';
    $('liveBadge').classList.toggle('off', !st.mixer.online);
    $('liveBadge').textContent = st.mixer.online ? 'LIVE' : 'OFF';
    $('stats').textContent = `${st.mixer.format} · треков: ${st.tracks}`;
    $('hist').innerHTML = (st.history || []).map((h) =>
      `<li>${new Date(h.played_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})} — ${esc(h.artist||'?')} — ${esc(h.title||'?')}</li>`).join('');
    $('djToggle').classList.toggle('on', st.program.djEnabled);
  } catch (e) { /* unauth уже обработан */ }
  refreshLists();
}

async function refreshLists() {
  if (!authed) return;
  const t = await api('/api/topics');
  $('topicList').innerHTML = t.items.length ? '' : '<div class="muted">тем нет — ведущий сам придумает</div>';
  for (const it of t.items) {
    $('topicList').insertAdjacentHTML('beforeend',
      `<div class="it"><span>${esc(it.text)} ${it.status==='used'?'<span class="muted">· сыграли</span>':''}</span>
       <button class="ghost" onclick="delTopic(${it.id})">✕</button></div>`);
  }
  const k = await api('/api/kb');
  $('kbList').innerHTML = k.items.length ? '' : '<div class="muted">пусто — добавьте факты для ведущего</div>';
  for (const it of k.items) {
    $('kbList').insertAdjacentHTML('beforeend',
      `<div class="it"><span>${esc(it.title)} <span class="muted">· ${it.chunks} чанк. ${it.embedded?'':'· ждёт эмбеддинг'}</span></span>
       <button class="ghost" onclick="delKb('${encodeURIComponent(it.title)}')">✕</button></div>`);
  }
}

window.delTopic = async (id) => { await api('/api/topics/' + id, { method:'DELETE' }); refreshLists(); };
window.delKb = async (title) => { await api('/api/kb/' + title, { method:'DELETE' }); refreshLists(); };

// ---------- плеер: плей / спектр / громкость ----------
const stream = $('stream');
const playBtn = $('playBtn');
const spec = $('spectrum');
let actx = null, analyser = null, rafId = null;

$('vol').value = localStorage.getItem('radioVol') ?? 1;
stream.volume = Number($('vol').value) || 1;
$('vol').oninput = (e) => {
  stream.volume = Number(e.target.value);
  localStorage.setItem('radioVol', e.target.value);
};

playBtn.onclick = () => {
  if (!stream.paused) {
    stream.pause();
    playBtn.textContent = '▶';
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    spec.getContext('2d').clearRect(0, 0, spec.width, spec.height);
    return;
  }
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaElementSource(stream);
    analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.8;
    src.connect(analyser);
    analyser.connect(actx.destination);
  }
  actx.resume();
  stream.play().catch(() => { playBtn.textContent = '▶'; });
  playBtn.textContent = '⏸';
  drawSpectrum();
};

function drawSpectrum() {
  rafId = requestAnimationFrame(drawSpectrum);
  spec.width = Math.max(1, spec.clientWidth * (window.devicePixelRatio || 1));
  spec.height = Math.max(1, spec.clientHeight * (window.devicePixelRatio || 1));
  const g = spec.getContext('2d');
  g.clearRect(0, 0, spec.width, spec.height);
  if (!analyser) return;
  const bins = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(bins);
  const N = 56;
  const bw = spec.width / N;
  for (let i = 0; i < N; i++) {
    const v = bins[i + 2] / 255;
    const h = Math.max(2, v * spec.height * 0.92);
    g.fillStyle = `rgba(255,92,57,${(0.3 + v * 0.7).toFixed(2)})`;
    g.fillRect(i * bw + bw * 0.18, spec.height - h, bw * 0.64, h);
  }
}

$('topicBtn').onclick = async () => {
  const r = await api('/api/topics', { method:'POST', body: JSON.stringify({ text: $('topicText').value }) });
  $('topicMsg').textContent = r.ok ? 'тема в очереди ✓' : r.error;
  if (r.ok) $('topicText').value = '';
  refreshLists();
};
$('callBtn').onclick = async () => {
  $('callBtn').disabled = true; $('callMsg').textContent = 'соединяю со студией…';
  try {
    const r = await api('/api/calls', { method:'POST', body: JSON.stringify({ name: $('callName').value, text: $('callText').value }) });
    $('callMsg').textContent = r.ok ? 'примут в эфир после текущего трека ✓' : (r.error || 'не вышло');
    if (r.ok) { $('callText').value = ''; }
  } catch { $('callMsg').textContent = 'ошибка'; }
  $('callBtn').disabled = false;
};
$('kbBtn').onclick = async () => {
  const r = await api('/api/kb', { method:'POST', body: JSON.stringify({ title: $('kbTitle').value, text: $('kbText').value }) });
  $('kbMsg').textContent = r.ok ? `запомнил (${r.chunks} чанк.) ✓` : r.error;
  if (r.ok) { $('kbTitle').value = ''; $('kbText').value = ''; }
  refreshLists();
};
$('djToggle').onclick = async () => {
  const on = !$('djToggle').classList.contains('on');
  await api('/api/dj', { method:'POST', body: JSON.stringify({ enabled: on }) });
  $('djToggle').classList.toggle('on', on);
};

// ---------- настройки эфира ----------
let setSchema = [];
const fieldId = (key) => 'set_' + key.replace(/\./g, '__');

async function loadSettings() {
  try {
    const r = await api('/api/settings');
    setSchema = r.schema || [];
    renderSettings(r.schema || [], r.values || {});
  } catch { /* не авторизованы — покажет логин */ }
}

function renderSettings(schema, values) {
  const groups = {};
  for (const s of schema) (groups[s.group] = groups[s.group] || []).push(s);
  let html = '';
  for (const [g, items] of Object.entries(groups)) {
    html += `<h3 class="set-h">${esc(g)}</h3><div class="set-grid">`;
    for (const s of items) {
      const id = fieldId(s.key);
      const v = values[s.key];
      if (s.type === 'bool') {
        html += `<div class="set-f bool"><span class="muted">${esc(s.label)}</span>
          <button type="button" class="toggle ${v ? 'on' : ''}" id="${id}"></button></div>`;
      } else if (s.type === 'select') {
        html += `<div class="set-f"><label>${esc(s.label)}</label><select id="${id}">
          ${s.options.map((o) => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}
        </select></div>`;
      } else if (s.type === 'textarea') {
        html += `<div class="set-f"><label>${esc(s.label)}</label><textarea id="${id}" style="min-height:44px">${esc(v || '')}</textarea></div>`;
      } else if (s.type === 'number') {
        html += `<div class="set-f"><label>${esc(s.label)}</label>
          <input id="${id}" type="number" min="${s.min}" max="${s.max}" step="${s.step}" value="${v}"></div>`;
      } else {
        html += `<div class="set-f"><label>${esc(s.label)}</label>
          <input id="${id}" type="text" value="${esc(v ?? '')}"></div>`;
      }
    }
    html += '</div>';
  }
  $('settingsBody').innerHTML = html;
  for (const el of document.querySelectorAll('#settingsBody .toggle')) {
    el.onclick = () => el.classList.toggle('on');
  }
}

function collectSettings() {
  const patch = {};
  for (const s of setSchema) {
    const el = $(fieldId(s.key));
    if (!el) continue;
    patch[s.key] = s.type === 'bool' ? el.classList.contains('on') : el.value;
  }
  return patch;
}

$('settingsSave').onclick = async () => {
  try {
    const r = await api('/api/settings', { method:'POST', body: JSON.stringify(collectSettings()) });
    if (!r.ok) { $('settingsMsg').textContent = r.error || 'ошибка'; return; }
    $('settingsMsg').textContent = `сохранили ${Object.keys(r.applied || {}).length} ✓`;
  } catch { $('settingsMsg').textContent = 'ошибка сохранения'; }
  setTimeout(() => { $('settingsMsg').textContent = ''; }, 4000);
};

$('settingsReset').onclick = async () => {
  const r = await api('/api/settings/reset', { method:'POST' });
  renderSettings(r.schema || [], r.values || {});
  $('settingsMsg').textContent = 'сброшено к дефолтам';
  setTimeout(() => { $('settingsMsg').textContent = ''; }, 3000);
};

async function refreshPublic() {
  try {
    const st = await fetch('/api/now').then((r) => r.json());
    $('radioName').textContent = st.radioName || 'Радио';
    $('loginName').textContent = st.radioName || 'Радио';
    const np = st.nowPlaying;
    $('npTitle').textContent = np && np.title ? np.title : 'тишина';
    $('npArtist').textContent = np && np.artist ? np.artist : '';
    $('liveBadge').classList.toggle('off', !st.live);
    $('liveBadge').textContent = st.live ? 'LIVE' : 'OFF';
  } catch { /* эфир догонит следующим тиком */ }
}

(async () => {
  $('app').style.display = 'block';
  showLogin(false);
  refreshPublic();
  setInterval(refreshPublic, 5000);
  try {
    const r = await fetch('/api/state');
    if (r.ok) { setAuthed(true); boot(); }
    else setAuthed(false);
  } catch { setAuthed(false); }
})();
</script>
</body>
</html>
